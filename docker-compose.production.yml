services:
  lotus-manage:
    environment:
      - APP_PERSISTENCE_PROFILE=PRODUCTION
      - DPM_SUPPORTABILITY_STORE_BACKEND=POSTGRES
      - DPM_SUPPORTABILITY_POSTGRES_DSN=postgresql://manage:manage@postgres:5432/manage_supportability
      - DPM_POLICY_PACKS_ENABLED=true
      - DPM_POLICY_PACK_CATALOG_BACKEND=POSTGRES
      - DPM_POLICY_PACK_POSTGRES_DSN=postgresql://manage:manage@postgres:5432/manage_supportability
      - ENTERPRISE_ENFORCE_AUTHZ=true
      - 'DPM_COMPOSITE_READ_SERVICE_GRANTS_JSON=${DPM_COMPOSITE_READ_SERVICE_GRANTS_JSON:-[]}'
      - 'DPM_COMPOSITE_SOURCES_JSON=${DPM_COMPOSITE_SOURCES_JSON:-}'
      - 'DPM_COMPOSITE_HISTORICAL_POLICY_ADMISSION_JSON=${DPM_COMPOSITE_HISTORICAL_POLICY_ADMISSION_JSON:-}'
      - 'DPM_COMPOSITE_ATTESTATION_VERIFICATION_JSON=${DPM_COMPOSITE_ATTESTATION_VERIFICATION_JSON:-}'
      - 'MANAGE_COMPOSITE_SOURCE_AUTH=${MANAGE_COMPOSITE_SOURCE_AUTH:-}'
      - 'MANAGE_HISTORICAL_PROVIDER_AUTH=${MANAGE_HISTORICAL_PROVIDER_AUTH:-}'
      - 'MANAGE_COMPOSITE_ATTESTATION_AUTH=${MANAGE_COMPOSITE_ATTESTATION_AUTH:-}'
      - 'MANAGE_COMPOSITE_CORE_ASSEMBLY_AUTH=${MANAGE_COMPOSITE_CORE_ASSEMBLY_AUTH:-}'
      - 'MANAGE_COMPOSITE_CORE_VERIFIER_AUTH=${MANAGE_COMPOSITE_CORE_VERIFIER_AUTH:-}'
      - ENTERPRISE_PRIMARY_KEY_ID=production-key-id-required
      - 'ENTERPRISE_CAPABILITY_RULES_JSON={"POST /api/v1":"manage.write","PUT /api/v1":"manage.write","PATCH /api/v1":"manage.write","DELETE /api/v1":"manage.write"}'
