[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lotus-manage"
version = "0.1.0"
description = "Discretionary portfolio management execution and lifecycle service for Lotus platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.133.0",
  "starlette>=1.0.1",
  "uvicorn>=0.41.0",
  "httpx>=0.28.0",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.13.0",
  "prometheus-client>=0.25.0",
  "psycopg[binary]>=3.2.0"
]

[project.optional-dependencies]
solver = [
  "cvxpy>=1.4.0",
  "numpy>=1.26.0"
]
dev = [
  "ruff>=0.15.0",
  "mypy>=1.19.0",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=7.0.0",
  "httpx>=0.28.0",
  "coverage>=7.13.0",
  "pip-audit>=2.10.0",
  "cvxpy>=1.4.0",
  "numpy>=1.26.0"
]
quality = [
  "bandit[toml]>=1.7.10",
  "deptry>=0.23.0",
  "import-linter>=2.1",
  "interrogate>=1.7.0",
  "radon>=6.0.1",
  "vulture>=2.14",
  "xenon>=0.9.3"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "unit: unit tests",
  "integration: integration tests",
  "e2e: end-to-end tests",
]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead\\.:DeprecationWarning",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".venv-codex", "output"]
skips = []

[tool.deptry]
known_first_party = ["src"]
exclude = ["tests", "output", ".venv", ".venv-codex"]
optional_dependencies_dev_groups = ["dev", "quality"]
per_rule_ignores = { DEP002 = ["pydantic-settings", "uvicorn"] }

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-module = true
ignore-nested-functions = true
ignore-private = true
ignore-property-decorators = true
fail-under = 45
exclude = ["tests", "output", ".venv", ".venv-codex"]
