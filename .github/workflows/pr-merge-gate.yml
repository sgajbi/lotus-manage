name: Pull Request Merge Gate

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.12"
  COVERAGE_FAIL_UNDER: "99"

jobs:
  workflow-lint:
    name: PR Merge Gate / Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@v1

  lint-typecheck-security:
    name: PR Merge Gate / Lint Typecheck Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Verify Dependencies
        run: python -m pip check
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Typecheck Critical Tests
        run: make typecheck-tests-critical
      - name: No-Alias Contract Guard
        run: make no-alias-gate
      - name: OpenAPI Gate
        run: make openapi-gate
      - name: API Vocabulary Gate
        run: make api-vocabulary-gate
      - name: Service Boundary Gate
        run: make service-boundary-gate
      - name: Router Infrastructure Gate
        run: make router-infrastructure-gate
      - name: Migration Contract Smoke
        run: make migration-smoke
      - name: Architecture Gate
        run: make architecture-gate
      - name: Complexity Gate
        run: make complexity-gate
      - name: Duplicate Implementation Gate
        run: make duplicate-implementation-gate
      - name: Dependency Hygiene Gate
        run: make dependency-hygiene-gate
      - name: Dead Code Gate
        run: make dead-code-gate
      - name: Workflow Policy Gate
        run: make workflow-policy-gate
      - name: Test Family Inventory Gate
        run: make test-family-inventory
      - name: Security Audit
        run: make security-audit

  quality-report:
    name: PR Merge Gate / Quality Report (PR Head)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Quality Report Freshness Gate
        run: make quality-report-gate

  test-suites:
    name: PR Merge Gate / Tests (${{ matrix.suite }})
    needs: [lint-typecheck-security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            path: tests/unit
          - suite: integration
            path: tests/integration
          - suite: e2e
            path: tests/e2e
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Run tests with coverage data
        env:
          COVERAGE_FILE: .coverage.${{ matrix.suite }}
        run: make test-${{ matrix.suite }}-coverage
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.suite }}
          path: .coverage.${{ matrix.suite }}
          include-hidden-files: true
          if-no-files-found: error

  idea-management-action-postgres:
    name: PR Merge Gate / Idea Management Action PostgreSQL
    needs: [lint-typecheck-security]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: manage_actions
          POSTGRES_USER: manage
          POSTGRES_PASSWORD: manage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manage -d manage_actions"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Prove durable Idea management action semantics
        env:
          COVERAGE_FILE: .coverage.idea-postgres
          DPM_POSTGRES_INTEGRATION_DSN: postgresql://manage:manage@127.0.0.1:5432/manage_actions
        run: make test-idea-management-action-postgres-coverage
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-idea-postgres
          path: .coverage.idea-postgres
          # A missing coverage file is a broken lane, not a shrug: the silent
          # warning here is exactly how the combined gate read a smaller
          # world and failed wrongly.
          if-no-files-found: error

  coverage-gate:
    name: PR Merge Gate / Coverage Gate (Combined)
    # The postgres lane's coverage artifact must exist before this gate
    # downloads coverage-data-* - a gate racing its own evidence reads a
    # smaller world and fails honestly but wrongly.
    needs: [test-suites, idea-management-action-postgres]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: coverage-data
      - name: Enforce Coverage Floor
        run: python scripts/coverage_gate.py --coverage-dir coverage-data --fail-under ${{ env.COVERAGE_FAIL_UNDER }}

  docker-build:
    name: PR Merge Gate / Docker Image Evidence
    needs: [coverage-gate, idea-management-action-postgres]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build Docker image and write evidence
        env:
          GIT_SHA: ${{ github.sha }}
          GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          CI_PIPELINE_ID: ${{ github.run_id }}
        run: make docker-image-evidence
      - name: Upload Docker image evidence
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-docker-image-evidence
          path: output/docker-image-evidence
          if-no-files-found: error
