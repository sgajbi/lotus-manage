name: Main Releasability Gate

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Optional merged pull-request SHA that this run must validate."
        required: false
        type: string
      triggering_pr:
        description: "Optional pull request number that dispatched this mainline validation."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.12"
  COVERAGE_FAIL_UNDER: "99"

jobs:
  exact-revision-assertion:
    name: Main Releasability / Exact Revision Assertion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Assert expected merged PR SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TRIGGERING_PR: ${{ inputs.triggering_pr }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ -z "$EXPECTED_SHA" ]; then
            echo "No expected_sha input supplied; treating this as an operator-dispatched main releasability run."
            exit 0
          fi
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Main releasability checkout SHA $actual_sha does not match expected merged PR SHA $EXPECTED_SHA for PR ${TRIGGERING_PR:-unknown}."
            exit 1
          fi
          echo "Validated exact merged PR SHA $EXPECTED_SHA for PR ${TRIGGERING_PR:-unknown}."

  workflow-lint:
    name: Main Releasability / Workflow Lint
    needs: [exact-revision-assertion]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@v1

  lint-typecheck-security:
    name: Main Releasability / Lint Typecheck Security
    needs: [exact-revision-assertion]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Verify Dependencies
        run: python -m pip check
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Typecheck Critical Tests
        run: make typecheck-tests-critical
      - name: No-Alias Contract Guard
        run: make no-alias-gate
      - name: OpenAPI Gate
        run: make openapi-gate
      - name: API Vocabulary Gate
        run: make api-vocabulary-gate
      - name: Service Boundary Gate
        run: make service-boundary-gate
      - name: Router Infrastructure Gate
        run: make router-infrastructure-gate
      - name: Migration Contract Smoke
        run: make migration-smoke
      - name: Architecture Gate
        run: make architecture-gate
      - name: Complexity Gate
        run: make complexity-gate
      - name: Duplicate Implementation Gate
        run: make duplicate-implementation-gate
      - name: Dependency Hygiene Gate
        run: make dependency-hygiene-gate
      - name: Dead Code Gate
        run: make dead-code-gate
      - name: Workflow Policy Gate
        run: make workflow-policy-gate
      - name: Quality Report Freshness Gate
        run: make quality-report-gate
      - name: Test Family Inventory Gate
        run: make test-family-inventory
      - name: Security Audit
        run: make security-audit

  test-suites:
    name: Main Releasability / Tests (${{ matrix.suite }})
    needs: [lint-typecheck-security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            path: tests/unit
          - suite: integration
            path: tests/integration
          - suite: e2e
            path: tests/e2e
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Run tests with coverage data
        env:
          COVERAGE_FILE: .coverage.${{ matrix.suite }}
        run: make test-${{ matrix.suite }}-coverage
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.suite }}
          path: .coverage.${{ matrix.suite }}
          include-hidden-files: true
          if-no-files-found: error

  coverage-gate:
    name: Main Releasability / Coverage Gate (Combined)
    needs: [test-suites]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: coverage-data
      - name: Enforce Coverage Floor
        run: python scripts/coverage_gate.py --coverage-dir coverage-data --fail-under ${{ env.COVERAGE_FAIL_UNDER }}
      - name: Upload coverage summary
        uses: actions/upload-artifact@v7
        with:
          name: main-releasability-coverage-data
          path: |
            .coverage
            coverage-data
          include-hidden-files: true
          if-no-files-found: error

  docker-build:
    name: Main Releasability / Docker Image Evidence
    needs: [coverage-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build Docker image and write evidence
        env:
          GIT_SHA: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          CI_PIPELINE_ID: ${{ github.run_id }}
        run: make docker-image-evidence
      - name: Upload Docker image evidence
        uses: actions/upload-artifact@v7
        with:
          name: main-releasability-docker-image-evidence
          path: output/docker-image-evidence
          if-no-files-found: error
